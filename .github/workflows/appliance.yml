name: Build appliance image

on:
  workflow_dispatch:
  # Runs after the container image is published, so the appliance always
  # embeds an image that already exists in the registry.
  workflow_run:
    workflows: ["Publish image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  LINUXKIT_VERSION: v1.8.2
  # sha256 of linuxkit-linux-amd64 from the v1.8.2 release.
  LINUXKIT_SHA256: 18b97b0d83401dd88ade14f207eb26358d9a7fde5d3dc4b1e24bd8faf087be6f

jobs:
  appliance:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LinuxKit (pinned and verified)
        run: |
          curl -fsSL -o linuxkit "https://github.com/linuxkit/linuxkit/releases/download/${LINUXKIT_VERSION}/linuxkit-linux-amd64"
          echo "${LINUXKIT_SHA256}  linuxkit" | sha256sum -c -
          chmod +x linuxkit
          sudo mv linuxkit /usr/local/bin/linuxkit

      - name: Build images
        run: |
          mkdir -p appliance/build
          # LinuxKit resolves this ghcr.io reference against Docker Hub, so pull it
          # into the local daemon first and let LinuxKit use the local copy.
          docker pull ghcr.io/ding-ding-projects/tunnel-doctor:latest
          linuxkit build --docker --format iso-efi --dir appliance/build appliance/tunnel-doctor.yml
          linuxkit build --docker --format raw-efi --dir appliance/build appliance/tunnel-doctor.yml
          ls -l appliance/build

      - name: Boot smoke check of the ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
          # The appliance keeps its data on the first blank disk, as it would on a real VM.
          qemu-img create -f qcow2 data.qcow2 4G
          qemu-system-x86_64 -nographic -m 1024 -machine q35 \
            -bios /usr/share/ovmf/OVMF.fd \
            -cdrom appliance/build/tunnel-doctor-efi.iso \
            -drive file=data.qcow2,if=virtio,format=qcow2 
            -net nic -net user,hostfwd=tcp::8080-:8080 \
            > qemu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then echo; echo "appliance answered after ~$((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "appliance did not answer in 300s"; tail -n 60 qemu.log; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-doctor-appliance
          path: |
            appliance/build/tunnel-doctor-efi.iso
            appliance/build/tunnel-doctor-efi.img
          if-no-files-found: error
